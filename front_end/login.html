<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - E-Vaccine Reminder</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            E-Vaccine Reminder
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Section -->

    <section class="form-section">

        <div class="form-container">

            <h1>
                Login
            </h1>

            <p class="form-description">
                Login to manage your child's vaccination records.
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn form-button"
                >
                    Login
                </button>


                <!-- Message -->

                <p id="loginMessage"></p>


            </form>


            <!-- Register Link -->

            <p class="form-footer">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>


        </div>

    </section>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
